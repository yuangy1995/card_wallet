name: Android build and UI checks
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ui-integration.yml'
  push:
    branches: [feat/android-wallet-card-list-favorites]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ui-integration.yml'
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run Android regression tests
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Upload debug APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-wallet-ui-checks-${{ github.run_id }}
          retention-days: 7
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
