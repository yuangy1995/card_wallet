name: Android build and UI checks
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ui-integration.yml'
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/libs.versions.toml
      - name: Compile, regression tests and Lint
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --stacktrace --max-workers=2
      - name: Build isolated preview APK
        id: preview
        if: ${{ !cancelled() }}
        working-directory: apps/android
        shell: bash
        run: |
          bash gradlew :app:assembleDebug -PwalletPreview=true --stacktrace --max-workers=2
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | tee app/build/outputs/apk/debug/package-id.txt
          grep -qx 'com.applist.cardwallet.preview' app/build/outputs/apk/debug/package-id.txt
          git rev-parse HEAD > app/build/outputs/apk/debug/BUILD_COMMIT
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS
      - name: Upload verified preview APK
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-wallet-ui-checks-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: apps/android/app/build/outputs/apk/debug/
      - name: Upload native screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-wallet-ui-reports-${{ github.run_id }}
          retention-days: 7
          path: |
            apps/android/app/build/outputs/ui-review/
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
