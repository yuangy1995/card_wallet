name: Signing security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject committed signing material and common credentials
        run: python3 scripts/check-signing-secrets.py
      - name: Test signing safety helpers
        run: python3 -m unittest discover -s scripts -p 'test_*security.py'
      - name: Test complete scan scope from client directories
        run: python3 -m unittest discover -s scripts -p 'test_signing_scan_scope.py'
      - name: Test release certificate verification
        run: python3 -m unittest discover -s apps/android/scripts -p 'test_*.py'
      - name: Test public release channel configuration
        run: python3 -m unittest discover -s scripts -p 'test_public_release_migration.py'

  recover-web-changes:
    # 仅恢复上一轮保留的公开代码供检查；完成后删除，不执行其中代码，不读取 Secrets。
    if: >-
      github.repository == 'yuangy1995/card_wallet' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.event.before == '12edcecef129d48a5fcfed4759979d8b03aa1517' &&
      github.run_attempt == 1
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6ab2b11f2cc47fc78273edb014290f23f0a8538
          persist-credentials: false
      - name: Save incomplete source payload for inspection only
        run: cp scripts/web-controls-changes.b64 "$RUNNER_TEMP/web-controls-changes.b64"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare locked dependencies for local verification
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          tar -czf "$RUNNER_TEMP/web-verification-deps.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-web-verification
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/web-controls-changes.b64
            ${{ runner.temp }}/web-verification-deps.tar.gz
