name: Signing security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan the complete tracked source without accessing signing Secrets
        run: python3 scripts/check-signing-secrets.py
      - name: Run signing and public release configuration tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s apps/android/scripts -p 'test_*.py'
      - name: Check patch whitespace
        run: git diff --check
