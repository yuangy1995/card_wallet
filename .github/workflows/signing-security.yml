name: Signing security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject committed signing material and common credentials
        run: python3 scripts/check-signing-secrets.py
      - name: Test signing safety helpers
        run: python3 -m unittest discover -s scripts -p 'test_*security.py'
      - name: Test complete scan scope from client directories
        run: python3 -m unittest discover -s scripts -p 'test_signing_scan_scope.py'
      - name: Test release certificate verification
        run: python3 -m unittest discover -s apps/android/scripts -p 'test_*.py'
      - name: Test public release channel configuration
        run: python3 -m unittest discover -s scripts -p 'test_public_release_migration.py'

  verify-macos-lock:
    # 收尾验证已通过全部原生测试的候选源码，完成后移除此任务。
    if: >-
      github.repository == 'yuangy1995/card_wallet' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.event.before == '4f954625f24bdff548766b8eedb5e5f9f8c2a2c8'
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f4287db0126667cc3111dc067176a9436568da4
          persist-credentials: false
      - name: Refine decoder concurrency and deterministic late-result regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('apps/macos/Features/CardPresentation.swift')
          source = p.read_text()
          old = '= CardImageCache.decodeThumbnail) {'
          assert source.count(old) == 1
          p.write_text(source.replace(old, '= { CardImageCache.decodeThumbnail($0, pixels: $1) }) {'))
          p = Path('apps/macos/Tests/LockMemoryTests.swift')
          source = p.read_text()
          old = '''        let gate = DispatchSemaphore(value: 0)
                  let cache = CardImageCache(readLock: { false }, decode: { _, _ in
                      started.fulfill()
                      _ = gate.wait(timeout: .now() + 5)
                      return nil
                  })
                  let task = Task { await cache.image(for: CardImageAsset(data: "synthetic"), pixels: 200) }'''
          new = '''        let gate = DispatchSemaphore(value: 0)
                  let url = try XCTUnwrap(Bundle.main.url(forResource: "AppIcon", withExtension: "png"))
                  let asset = CardImageAsset(data: try Data(contentsOf: url).base64EncodedString(), name: "synthetic")
                  let decoded = try XCTUnwrap(CardImageCache.decodeThumbnail(asset.data, pixels: 200))
                  let cache = CardImageCache(readLock: { false }, decode: { _, _ in
                      started.fulfill()
                      _ = gate.wait(timeout: .now() + 5)
                      // Simulate a system decoder that returns a valid image even after cancellation.
                      return decoded
                  })
                  let task = Task { @MainActor in await cache.image(for: asset, pixels: 200) != nil }'''
          assert old in source
          source = source.replace(old, new)
          old = '        let image = await task.value\n        XCTAssertNil(image)'
          assert old in source
          p.write_text(source.replace(old, '        let returnedAnImage = await task.value\n        XCTAssertFalse(returnedAnImage)'))
          subprocess.run(['git', 'add', 'apps/macos/Features/CardPresentation.swift', 'apps/macos/Tests/LockMemoryTests.swift'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['python3', 'scripts/check-signing-secrets.py'], check=True)
          PY
      - name: Generate native test project
        working-directory: apps/macos
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          mkdir -p build
      - name: Verify lock lifecycle and attachment regressions
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild test -project CreditCardMac.xcodeproj -scheme CreditCardMac -destination 'platform=macOS' -only-testing:CreditCardMacTests/LockMemoryTests -only-testing:CreditCardMacTests/CardAttachmentTests -derivedDataPath build/LockReviewDerivedData -resultBundlePath build/LockReview.xcresult CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_APP_SANDBOX=NO WALLET_CODE_SIGN_ENTITLEMENTS=Resources/CreditCardMacAdHoc.entitlements 2>&1 | tee build/lock-tests.log
      - name: Summarize native tests
        if: always()
        working-directory: apps/macos
        run: |
          if test -d build/LockReview.xcresult; then
            xcrun xcresulttool get test-results summary --path build/LockReview.xcresult > build/lock-test-summary.json || true
          fi
      - name: Export verified source objects without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          repo = 'repos/yuangy1995/card_wallet'
          def api(path, body=None):
              args = ['gh', 'api', repo + path]
              if body is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.check_output(args, input=json.dumps(body) if body is not None else None, text=True))
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(names) == {'apps/macos/Features/CardPresentation.swift', 'apps/macos/Tests/LockMemoryTests.swift'}
          assert api('/git/ref/heads/main')['object']['sha'] == os.environ['GITHUB_SHA'], 'Main changed during verification'
          entries = []
          for name in sorted(names):
              data = subprocess.check_output(['git', 'show', ':' + name])
              sha = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = api('/git/trees', {'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'tree': entries})['sha']
          result = {'base': os.environ['GITHUB_SHA'], 'tree': tree, 'entries': entries, 'lock_and_attachment_tests': 'passed'}
          Path('prepared-macos-lock.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
          print(json.dumps(result, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-lock-verification-final
          retention-days: 3
          path: |
            prepared-macos-lock.json
            apps/macos/build/lock-tests.log
            apps/macos/build/lock-test-summary.json
