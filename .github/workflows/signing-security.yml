name: Signing security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject committed signing material and common credentials
        run: python3 scripts/check-signing-secrets.py
      - name: Test signing safety helpers
        run: python3 -m unittest discover -s scripts -p 'test_*security.py'
      - name: Test complete scan scope from client directories
        run: python3 -m unittest discover -s scripts -p 'test_signing_scan_scope.py'
      - name: Test release certificate verification
        run: python3 -m unittest discover -s apps/android/scripts -p 'test_*.py'
      - name: Test public release channel configuration
        run: python3 -m unittest discover -s scripts -p 'test_public_release_migration.py'

  verify-macos-lock:
    # 仅验证本次已授权的 macOS 修复；完成后移除，不增加工作流入口。
    if: >-
      github.repository == 'yuangy1995/card_wallet' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.event.before == '22706f54605695d1996726b4dec53340a6d3f733'
    needs: check
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve and verify reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          shas = ['64c4ecfd8194183abed3207ca03d4d268a917911',
                  '1d1e3949f371750beb546375511cbd04e8645893',
                  '95a38065fa7ded8445c68bc4b6645ec0903fbbe0',
                  '93773df816d3b16ceadce942bf72c0a9a7d002b3']
          parts = []
          for index, sha in enumerate(shas):
              blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/yuangy1995/card_wallet/git/blobs/' + sha], text=True))
              encoded = ''.join(blob['content'].split())
              if index == 2:
                  # Restore six verified transport transcription differences, then check the original Git object.
                  for old, new in [('rUz3II1x', 'rUz3xzII1x'), ('dox5ijo7', 'dox5ojo7'),
                                   ('35Qv35', '35Yv35'), ('37sPpy6', '37sPvy6'),
                                   ('l4bce1Lz', 'l4bW1Lz'), ('cnu9c3+6', 'cnu9c+6')]:
                      assert encoded.count(old) == 1
                      encoded = encoded.replace(old, new)
              data = base64.b64decode(encoded, validate=True)
              expected = '0edecbff995b084bde34489bc341985223fe7068' if index == 2 else sha
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected
              parts.append(data)
          patch = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == 'd34d3681dc4ba0d40cc86c95de42e3baf03d51a298f6ad6d47edd4ac22c8549c'
          path = Path(os.environ['RUNNER_TEMP']) / 'macos-lock.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['python3', 'scripts/check-signing-secrets.py'], check=True)
          print('Reviewed macOS patch verified and applied; no branch has been changed.')
          PY
      - name: Generate native test project
        working-directory: apps/macos
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          mkdir -p build
      - name: macOS native tests including lock lifecycle regressions
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild test -project CreditCardMac.xcodeproj -scheme CreditCardMac -destination 'platform=macOS' -derivedDataPath build/LockReviewDerivedData -resultBundlePath build/LockReview.xcresult CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_APP_SANDBOX=NO WALLET_CODE_SIGN_ENTITLEMENTS=Resources/CreditCardMacAdHoc.entitlements 2>&1 | tee build/lock-tests.log
      - name: Summarize native tests
        if: always()
        working-directory: apps/macos
        run: |
          if test -d build/LockReview.xcresult; then
            xcrun xcresulttool get test-results summary --path build/LockReview.xcresult > build/lock-test-summary.json || true
          fi
      - name: Export verified source objects without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          repo = 'repos/yuangy1995/card_wallet'
          def api(path, body=None):
              args = ['gh', 'api', repo + path]
              if body is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.check_output(args, input=json.dumps(body) if body is not None else None, text=True))
          expected = {'apps/macos/App/ContentView.swift',
                      'apps/macos/Domain/CardSystemNotificationCenter.swift',
                      'apps/macos/Domain/KeychainManager.swift',
                      'apps/macos/Domain/LockScopedValue.swift',
                      'apps/macos/Domain/SyncCoordinator.swift',
                      'apps/macos/Domain/WebDAVBridgeService.swift',
                      'apps/macos/Features/CardPresentation.swift', 'apps/macos/README.md',
                      'apps/macos/Tests/CardAttachmentTests.swift', 'apps/macos/Tests/LockMemoryTests.swift',
                      'docs/macos-lock-memory-20260919.md'}
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(names) == expected, 'Unexpected change scope'
          assert api('/git/ref/heads/main')['object']['sha'] == os.environ['GITHUB_SHA'], 'Main changed during verification'
          entries = []
          for name in sorted(names):
              data = subprocess.check_output(['git', 'show', ':' + name])
              sha = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = api('/git/trees', {'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'tree': entries})['sha']
          result = {'base': os.environ['GITHUB_SHA'], 'tree': tree, 'entries': entries, 'macos_native_tests': 'passed'}
          Path('prepared-macos-lock.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
          print(json.dumps(result, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-lock-verification
          retention-days: 3
          path: |
            prepared-macos-lock.json
            apps/macos/build/lock-tests.log
            apps/macos/build/lock-test-summary.json
