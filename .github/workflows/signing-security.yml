name: Signing security

on:
  pull_request:
  push:
    branches: [main, codex/android-unlock-loading-20260919]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject committed signing material and common credentials
        run: python3 scripts/check-signing-secrets.py
      - name: Test signing safety helpers
        run: python3 -m unittest discover -s scripts -p 'test_*security.py'
      - name: Test complete scan scope from client directories
        run: python3 -m unittest discover -s scripts -p 'test_signing_scan_scope.py'
      - name: Test release certificate verification
        run: python3 -m unittest discover -s apps/android/scripts -p 'test_*.py'
      - name: Test public release channel configuration
        run: python3 -m unittest discover -s scripts -p 'test_public_release_migration.py'

  prepare-unlock-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/android-unlock-loading-20260919'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply reviewed Android changes with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          parts = [
              ('c890f93664859867f33124f4f8d509298f2ebdd1', 'ae1aad1a11ed9de0899ba1021e3da5ed38a7a945a4208e14b66266907874a97f'),
              ('1c9f4ae0315b2c58c04bdb141f9514ccb3fbb4be', 'befcfb8294820d5da449c2168dd184bcb5faf6e2c2d175fe78da62a938638d99'),
              ('1f1b9714d90e4b74525a6ef5472426e4e8f08801', 'de58b8d45e93945020c0b929aa0b143ebf5dbdfcdf064a40f7a555aaec030336')]
          for sha, digest in parts:
              blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/yuangy1995/card_wallet/git/blobs/' + sha]))
              text = base64.b64decode(blob['content']).decode().replace('\n diff --git ', '\ndiff --git ')
              assert hashlib.sha256(text.encode()).hexdigest() == digest, 'Patch checksum mismatch'
              path = Path(os.environ['RUNNER_TEMP']) / (sha + '.patch')
              path.write_text(text)
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['python3', 'scripts/check-signing-secrets.py'], check=True)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle.kts
      - name: Android build, unit and UI regressions, Lint, instrumentation compilation
        working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --stacktrace --max-workers=2
      - name: Export tested source tree without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          def api(path, data):
              return json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/yuangy1995/card_wallet' + path, '--input', '-'], input=json.dumps(data), text=True))
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(names) == 8 and all(name.startswith('apps/android/') for name in names)
          entries = []
          for name in names:
              data = subprocess.check_output(['git', 'show', ':' + name])
              sha = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          tree = api('/git/trees', {'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'tree': entries})['sha']
          Path('unlock-fix-result.json').write_text(json.dumps({'base': os.environ['GITHUB_SHA'], 'tree': tree, 'files': entries}, indent=2))
          print('Prepared tree:', tree)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unlock-verification
          retention-days: 7
          path: |
            unlock-fix-result.json
            apps/android/app/build/test-results/
            apps/android/app/build/reports/
