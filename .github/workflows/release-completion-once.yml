name: Verify and complete authorized releases

# 仅执行本次已授权的发布修复；两端发布结束后再删除，不能提前推进主线。
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-completion-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  verify-and-dispatch:
    if: >-
      github.repository == 'yuangy1995/card_wallet' &&
      github.ref == 'refs/heads/main' &&
      github.event.before == '4cabe27275ee55f69d93b43b4089939477f81bfb' &&
      github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release safety and retained regression coverage
        run: |
          set -euo pipefail
          python3 scripts/check-signing-secrets.py
          python3 -m unittest discover -s scripts -p 'test_*security.py'
          python3 -m unittest discover -s scripts -p 'test_signing_scan_scope.py'
          python3 -m unittest discover -s scripts -p 'test_public_release_migration.py'
          python3 -m unittest discover -s apps/android/scripts -p 'test_*.py'
          cd apps/macos
          swift scripts/test-verify-update.swift
      - name: Dispatch fresh official builds on the verified revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: yuangy1995/card_wallet
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api --paginate "repos/$REPOSITORY/actions/runs?branch=main&event=workflow_dispatch&per_page=100" |
            jq -se 'all(.[].workflow_runs[]; (.path != ".github/workflows/android-release.yml" and .path != ".github/workflows/macos-release.yml") or .status == "completed")'
          gh workflow run android-release.yml --repo "$REPOSITORY" --ref main \
            -f version=1.3.0 -f version_code=5 -f publish=true
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh workflow run macos-release.yml --repo "$REPOSITORY" --ref main \
            -f version=1.1.0 -f publish=true
          echo '标签安全与发布回归检查通过，已请求两端正式发布；不能提前删除本工作流。' >> "$GITHUB_STEP_SUMMARY"
