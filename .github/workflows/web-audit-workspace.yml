name: Web audit workspace
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/web-audit-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'codex/web-security-performance-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked Web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Pack isolated verification inputs
        run: |
          mkdir -p /tmp/wallet-audit/apps /tmp/wallet-audit/.github
          cp -a apps/web /tmp/wallet-audit/apps/web
          cp -a .github/workflows /tmp/wallet-audit/.github/
          cp -a docs AGENTS.md README.md /tmp/wallet-audit/
          find apps/ios apps/macos apps/android -type f \( -name '*.swift' -o -name '*.kt' -o -name 'project.yml' \) -print0 | tar --null -T - -cf - | tar -xf - -C /tmp/wallet-audit
          tar -czf /tmp/wallet-audit-workspace.tar.gz -C /tmp/wallet-audit .
      - uses: actions/upload-artifact@v4
        with:
          name: web-audit-workspace
          path: /tmp/wallet-audit-workspace.tar.gz
          retention-days: 1
