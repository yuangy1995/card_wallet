name: Apply final parity fixes
on:
  push:
    branches: [codex/four-platform-parity-20260918]
    paths: [.github/workflows/parity-final-fixes.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/four-platform-parity-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified patch and remove temporary workflows
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''''''
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '82ab6744de58163c453279fa6a99bf1a8b560729c64e14e77344b4ab7b4fdd47'
          expected = {
            '.github/workflows/platform-quality.yml': 'd0a010effe59c9a804467cf2a9068169550c679be4956718f8d18b160d910fd1',
            'apps/android/app/src/main/java/com/example/creditcard/ui/CardFormScreen.kt': '32478a43d17a75ba7417cee3f81fbbe9e5e79afa76ec138a198a1cac8755e366',
            'apps/ios/Features/StatisticsView.swift': '54dafad59f6e408ba864ba4962022d158d1adee75f2d75f5ef820fdd12e5a26e',
            'apps/web/scripts/parity-browser-regression.py': '5d888e8b2d927cd21bcd93ae6d650d12aafa27b9f17dd505944636122cd9fb21'
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          pathlib.Path('/tmp/verified.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/verified.patch'],check=True)
          subprocess.run(['git','apply','/tmp/verified.patch'],check=True)
          subprocess.run(['git','add',*expected],check=True)
          PY
          git rm .github/workflows/parity-final-fixes.yml .github/workflows/parity-resume-source.yml
          git diff --cached --check
          git config user.name 'lovelife'
          git config user.email '32153802+yuangy1995@users.noreply.github.com'
          git commit -m '修复iOS统计编译、Android文案资源调用及首次提醒浏览器回归时序'
          git push origin HEAD:codex/four-platform-parity-20260918
