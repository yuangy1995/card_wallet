name: Web quality

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'contracts/**'
      - 'scripts/sync-wallet-brand-assets.py'
      - '.github/workflows/web-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'contracts/**'
      - 'scripts/sync-wallet-brand-assets.py'
      - '.github/workflows/web-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify offline branding
        run: python3 ../../scripts/sync-wallet-brand-assets.py --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression tests
        run: pnpm test:run
      - name: Production build
        run: pnpm build
      - name: Install browser regression runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Production browser regressions
        run: |
          python scripts/browser-regression.py
          python scripts/parity-browser-regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-regressions
          path: apps/web/browser-results
          retention-days: 7
