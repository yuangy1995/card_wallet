name: Apply verified accessibility fix
on:
  push:
    branches: [codex/four-platform-parity-20260918]
    paths: [.github/workflows/parity-accessibility-fix.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/four-platform-parity-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the card suffix with accessibility text sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('apps/ios/Features/CreditCardView.swift')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'f59491457ecf73d6d5923e47fb4369b55f6463c690293d7820a42a6057fdcb42'
          s=p.read_text().replace('    @State private var isShowingNumber = false', '    @Environment(\\.dynamicTypeSize) private var dynamicTypeSize\n    @State private var isShowingNumber = false', 1)
          s=s.replace('        if !isShowingNumber {\n            if clean.count >= 16 {', '        if !isShowingNumber {\n            // 大字体下优先保留识别卡片所需的末四位，不让掩码挤掉尾号。\n            if dynamicTypeSize.isAccessibilitySize && clean.count >= 4 {\n                return "•••• \\(clean.suffix(4))"\n            }\n            if clean.count >= 16 {', 1)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '53fc461a993403c5cc0adb9adf7ae71464ccb9e1941f8efa1da7c341b6d278b3'
          p=Path('docs/four-platform-parity-2026-09-18.md')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'd28073cfcaed2af577c7520cebea58d3edad604b4ff33c2306b402faff722832'
          p.write_text(p.read_text().replace('避免使用物理屏幕宽度破坏 iPad 分屏。', '避免使用物理屏幕宽度破坏 iPad 分屏。大字体模式使用紧凑卡号掩码，确保末四位不会被掩码挤出。'))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'e805fd1ea3f9944df962457971dc91d9032a481706b54025d9445ecf812d82a2'
          PY
          git add apps/ios/Features/CreditCardView.swift docs/four-platform-parity-2026-09-18.md
          git diff --cached --check
          git config user.name 'lovelife'
          git config user.email '32153802+yuangy1995@users.noreply.github.com'
          git commit -m '大字体下保留卡号末四位并补充原生显示说明'
          git push origin HEAD:codex/four-platform-parity-20260918
