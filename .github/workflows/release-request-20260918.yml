name: Request Android and macOS official releases

# 一次性执行维护者本次明确授权的发布请求，完成后删除本文件。
# 不读取、生成或上传私钥；正式签名和发布仍由现有工作流独立校验。
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-request-20260918.yml']

permissions:
  contents: read
  actions: write

concurrency:
  group: card-wallet-release-request-20260918
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'yuangy1995/card_wallet' &&
      github.ref == 'refs/heads/main' &&
      github.event.before == '4d68a789698576ccdd97cc6afb2bcb2f03410379' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: yuangy1995/card_wallet
    steps:
      - name: Verify requested source revision and absence of active releases
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api --paginate "repos/$REPOSITORY/actions/runs?branch=main&event=workflow_dispatch&per_page=100" |
            jq -se 'all(.[].workflow_runs[]; (.path != ".github/workflows/android-release.yml" and .path != ".github/workflows/macos-release.yml") or .status == "completed")'

      - name: Request Android 1.3.0 build 5 official release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh workflow run android-release.yml --repo "$REPOSITORY" --ref main \
            -f version=1.3.0 -f version_code=5 -f publish=true
          echo '已请求 Android 正式发布；以独立发布工作流的签名校验和最终结果为准。' >> "$GITHUB_STEP_SUMMARY"

      - name: Request macOS 1.1.0 build 7 official release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh workflow run macos-release.yml --repo "$REPOSITORY" --ref main \
            -f version=1.1.0 -f publish=true
          echo '已请求 macOS 正式发布；以独立发布工作流的签名校验和最终结果为准。' >> "$GITHUB_STEP_SUMMARY"
