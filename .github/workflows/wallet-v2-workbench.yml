name: Wallet v2 workbench
on:
  push:
    branches: [feat/android-wallet-redesign-v2]
    paths: ['tools/wallet_v2_apply.py', '.github/workflows/wallet-v2-workbench.yml']
permissions:
  contents: write
concurrency:
  group: wallet-v2-workbench
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-wallet-redesign-v2
      - name: Apply revision if present
        run: |
          if test -f tools/wallet_v2_apply.py; then
            python3 -m pip install 'CairoSVG==2.8.2' 'Pillow==11.3.0'
            python3 tools/wallet_v2_apply.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/android
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m '重构原生卡包排版、透明品牌资产与同步设置'
              git push origin HEAD:feat/android-wallet-redesign-v2
            fi
          fi
      - name: Export review sources without signing material
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('.')
          with zipfile.ZipFile('wallet-v2-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
            for path in [root/'AGENTS.md', *sorted((root/'apps/android').rglob('*'))]:
              if not path.is_file() or any(x in path.parts for x in ['build','.gradle','.kotlin']): continue
              if path.suffix in ['.jks','.keystore','.apk'] or path.name in ['local.properties']: continue
              z.write(path, str(path))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-v2-sources-${{ github.run_id }}
          path: wallet-v2-sources.zip
          retention-days: 3
      - uses: actions/setup-java@v4
        if: hashFiles('tools/wallet_v2_apply.py') != ''
        with:
          distribution: temurin
          java-version: '17'
      - name: Native build and tests
        if: hashFiles('tools/wallet_v2_apply.py') != ''
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-v2-validation-${{ github.run_id }}
          retention-days: 7
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/ui-review/
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
