name: Wallet v2 workbench
on:
  push:
    branches: [feat/android-wallet-redesign-v2]
    paths: ['tools/wallet_v2_apply.py', '.github/workflows/wallet-v2-workbench.yml']
permissions:
  contents: write
concurrency:
  group: wallet-v2-workbench
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-wallet-redesign-v2
      - name: Apply reviewed Android changes
        run: |
          python3 -m pip install 'CairoSVG==2.8.2' 'Pillow==11.3.0'
          python3 tools/wallet_v2_apply.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/android/app/src/test/java/com/example/creditcard/ui/wallet/WalletV2VisualTest.kt')
          s=p.read_text()
          s=s.replace('compose.onNodeWithTag("wallet_theme_picker").assertHeightIsAtMost(100.dp)', 'val picker = compose.onNodeWithTag("wallet_theme_picker").getUnclippedBoundsInRoot()\n        assertTrue((picker.bottom - picker.top).value < 100f)')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m '修正原生截图测试的布局尺寸测量'
            git push origin HEAD:feat/android-wallet-redesign-v2
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v5
        id: gradle-cache
        with:
          key: wallet-v2-gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            wallet-v2-gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml') }}-
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
      - name: Native regression tests and screenshots
        working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest --continue --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-v2-native-tests-${{ github.run_id }}
          retention-days: 7
          path: |
            apps/android/app/build/outputs/ui-review/
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
      - name: Debug build and full Lint
        if: always()
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:lintDebug --continue --stacktrace --max-workers=2
      - name: Build isolated preview APK
        if: always()
        working-directory: apps/android
        run: |
          bash gradlew :app:assembleDebug -PwalletPreview=true --stacktrace --max-workers=2
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | tee app/build/outputs/apk/debug/package-id.txt
          grep -qx 'com.applist.cardwallet.preview' app/build/outputs/apk/debug/package-id.txt
          git rev-parse HEAD > app/build/outputs/apk/debug/BUILD_COMMIT
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-v2-validation-${{ github.run_id }}
          retention-days: 7
          path: |
            apps/android/app/build/outputs/apk/debug/
            apps/android/app/build/outputs/ui-review/
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
      - uses: actions/cache/save@v5
        if: always()
        with:
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
