name: Remove exposed signing history

on:
  push:
    branches: [main]
    paths: ['.github/workflows/security-history-cleanup.yml']

permissions:
  contents: read

concurrency:
  group: card-wallet-public-release
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'yuangy1995/card_wallet' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_MAIN_SHA: ad1e41590234f808e3d62fecd53e7f07fb1f509a
    steps:
      - name: Install pinned history cleaner
        run: python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/filter-python" git-filter-repo==2.47.0
      - name: Prepare and verify rewritten history without remote writes
        env:
          PYTHONPATH: ${{ runner.temp }}/filter-python
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          repo = root / 'rewrite.git'
          url = 'https://github.com/yuangy1995/card_wallet.git'
          expected = os.environ['GITHUB_SHA']
          backup = os.environ['BACKUP_MAIN_SHA']
          def run(args, cwd=None, data=None):
              result = subprocess.run(args, cwd=cwd, input=data, capture_output=True)
              if result.returncode:
                  raise RuntimeError('History maintenance command failed; credential output suppressed.')
              return result.stdout
          def git(*args):
              return run(['git', '--git-dir=' + str(repo), *args])
          run(['git', 'clone', '--mirror', url, str(repo)])
          assert git('rev-parse', 'refs/heads/main').decode().strip() == expected, 'Main moved; abort.'
          assert git('rev-parse', expected + '^').decode().strip() == backup, 'Backup baseline changed; abort.'
          changed = git('diff', '--name-only', backup, expected).decode().splitlines()
          assert changed == ['.github/workflows/security-history-cleanup.yml'], 'Unbacked changes; abort.'
          writable = git('for-each-ref', '--format=%(refname)', 'refs/heads', 'refs/tags').decode().splitlines()
          assert writable == ['refs/heads/main'], 'Unexpected branch or tag; abort.'
          integrated = ['e8b8333b778927d9206b2f7a5d2a93ec52cf6bec', '6948ec4e68eb54a6bda743c697e1e47c3affbbb1', '8608232bceae1f07c5617f1d5547cdd5e6846169']
          for commit in integrated:
              git('merge-base', '--is-ancestor', commit, 'refs/heads/main')
          def blobs():
              objects = git('rev-list', '--objects', '--all').splitlines()
              ids = [line.split(b' ', 1)[0] for line in objects]
              metadata = run(['git', '--git-dir=' + str(repo), 'cat-file', '--batch-check'], data=b'\n'.join(ids)).splitlines()
              process = subprocess.Popen(['git', '--git-dir=' + str(repo), 'cat-file', '--batch'], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
              try:
                  for row in metadata:
                      oid, kind, size = row.split()
                      if kind != b'blob':
                          continue
                      process.stdin.write(oid + b'\n')
                      process.stdin.flush()
                      header = process.stdout.readline().split()
                      data = process.stdout.read(int(header[2]))
                      assert process.stdout.read(1) == b'\n'
                      yield oid, data
              finally:
                  process.stdin.close()
                  process.wait()
          password_pattern = re.compile(rb'''(?:storePassword|keyPassword)\s*=?\s*["']([^"'\r\n]+)["']''')
          gradle_ids = {line.split(b' ', 1)[0] for line in git('rev-list', '--objects', '--all').splitlines() if line.endswith((b'.gradle', b'.gradle.kts'))}
          passwords = set()
          for oid, data in blobs():
              if oid in gradle_ids:
                  passwords.update(password_pattern.findall(data))
          assert len(passwords) == 1, 'Unexpected credential inventory; abort.'
          assert all(b'==>' not in value and b'\x00' not in value for value in passwords)
          redactions = root / 'history-redactions.private'
          redactions.write_bytes(b''.join(b'literal:' + value + b'==>REMOVED_EXPOSED_SIGNING_PASSWORD\n' for value in sorted(passwords)))
          redactions.chmod(0o600)
          removed_paths = ['app/release.jks', 'apps/android/app/release.jks']
          old_tree = git('rev-parse', 'refs/heads/main^{tree}').decode().strip()
          count_before = int(git('rev-list', '--all', '--count'))
          command = [sys.executable, '-m', 'git_filter_repo', '--sensitive-data-removal', '--no-fetch', '--invert-paths']
          for path in removed_paths:
              command.extend(['--path', path])
          command.extend(['--replace-text', str(redactions), '--replace-message', str(redactions), '--prune-empty', 'never', '--prune-degenerate', 'never'])
          run(command, cwd=repo)
          assert old_tree == git('rev-parse', 'refs/heads/main^{tree}').decode().strip(), 'Current source tree changed; abort.'
          assert count_before == int(git('rev-list', '--all', '--count')), 'Commit history was dropped; abort.'
          historical_paths = set(git('log', '--all', '--pretty=format:', '--name-only').decode().splitlines())
          assert not historical_paths.intersection(removed_paths), 'Signing path survived rewrite.'
          for _, data in blobs():
              assert not any(value in data for value in passwords), 'Credential survived rewrite.'
          changes = (repo / 'filter-repo/changed-refs').read_text().splitlines()
          first = (repo / 'filter-repo/first-changed-commits').read_text().splitlines()
          report = {'date': '2026-09-18', 'backup_main': backup, 'previous_main': expected,
                    'commit_count_before': count_before, 'commit_count_after_filter': count_before,
                    'current_tree_preserved': True, 'removed_paths': removed_paths,
                    'replaced_literal_passwords': len(passwords), 'affected_pull_refs': [ref for ref in changes if ref.startswith('refs/pull/')],
                    'first_changed_commits': first, 'remote_updated': False}
          work = root / 'cleaned-work'
          git('worktree', 'add', str(work), 'main')
          obsolete = ['security-finalize-audit.yml', 'security-history-cleanup.yml', 'migration-backup-once.yml', 'integrate-retired-branches-once.yml']
          for name in obsolete:
              path = work / '.github/workflows' / name
              if path.exists():
                  path.unlink()
          doc = work / 'docs/signing-security.md'
          text = doc.read_text()
          start = text.index('## 历史和分支')
          end = text.index('## 检查', start)
          text = text[:start] + '''## 历史和分支

          2026-09-18 已核对两个旧对齐分支和发布迁移分支的提交均已整合，远端仅保留 `main`，没有发布标签或未合并 PR。一次性迁移工作流已移除，避免误执行旧分支整合。

          在完成可解密的仓库外加密备份后，已从 `main` 的可达历史移除两处旧 Android keystore 路径，并替换确认泄漏的明文签名密码。保留全部提交和合并关系；过滤前后当前源码树完全一致。范围和核验结果见 [历史清理记录](signing-history-cleanup-2026-09-18.md)。

          历史重写后必须重新克隆仓库，不要直接合并旧克隆再推送。提交 SHA 和历史签名会变化；公钥、应用标识和数据目录不变。

          GitHub 的 PR 引用、缓存和别人已下载的副本不受主线强推控制。已记录受影响 PR 1–8，仍需由仓库所有者向 GitHub Support 申请评估缓存和引用清理；不能把主线检查通过表述成互联网所有副本已消失。不得创建含旧密钥的公开备份分支或标签。

          历史清理不替代新密钥配置。发布仍严格依赖与仓库公开信任基准匹配的六项 Secrets，缺失或不匹配时停止发布，不能复用旧签名。

          ''' + text[end:]
          doc.write_text(text)
          audit_doc = work / 'docs/signing-history-cleanup-2026-09-18.md'
          audit_doc.write_text('''# 已泄漏签名历史清理 · 2026-09-18

          ## 范围与备份

          源码仓库继续公开，发布和两端在线更新均使用 `yuangy1995/card_wallet`。本次仅移除已确认泄漏的 Android 签名材料，不删除应用数据、不更改业务实现、不取消签名验证，也不删除旧产物仓库。

          清理前已创建包含全部可获取引用的 Git bundle，以 AES-256-GCM 加密，再用仓库外 RSA 公钥封装数据密钥。下载后已成功解密、核对 SHA-256 并恢复 Git 镜像；私钥和明文历史从未上传为公开附件。

          ## 验证结果

          - 移除历史路径 `app/release.jks`、`apps/android/app/release.jks`。
          - 全历史替换确认的 1 个旧明文签名密码，并再次扫描可达对象；不在文档中展示密码。
          - `git-filter-repo 2.47.0` 保留所有提交和合并关系，过滤前后主线当前源码树完全一致。只另行更新本文档并删除已结束的一次性维护工作流。
          - 两个旧四端分支和发布迁移分支已在清理前通过祖先关系验证；远端只有 `main`。使用固定主线提交租约推送，拒绝覆盖检查期间新增的提交。
          - 签名安全、发布地址和 Android 发布验证回归必须全部通过后才允许推送。

          ## GitHub Support 与本地克隆

          主线历史清理不会删除 GitHub 只读的 PR 引用。受影响的 PR 为 1–8；Support 申请所需的 First Changed Commit 映射为：

          ```text
          ''' + '\n'.join(first) + '''
          ```

          申请中说明已清理可写引用，但请求评估 PR 缓存、旧提交页面与不可达对象清理。Support 是否执行由 GitHub 评估；未宣称已完成服务器垃圾回收或删除第三方副本。

          旧克隆请保留在不公开的备份位置，重新克隆清理后的仓库开始工作；不得把旧历史合并回主线。

          ## 发布状态

          2026-09-18 的独立 CI 核验发现：五项 Android 签名 Secrets 尚未配置，已有 `SPARKLE_PRIVATE_KEY` 不匹配本次新公钥。该状态不是密钥已经上传。使用仓库外的新签名备份执行 `scripts/upload-release-secrets.py --directory <私有目录> --publish`，六项配置全部成功后再运行两端正式发布；不以旧密钥或未签名产物替代。

          ''')
          for args in [['python3', 'scripts/check-signing-secrets.py'], ['python3', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_*security.py'], ['python3', '-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_public_release_migration.py'], ['python3', '-m', 'unittest', 'discover', '-s', 'apps/android/scripts', '-p', 'test_*.py']]:
              run(args, cwd=work)
          run(['git', 'config', 'user.name', 'github-actions[bot]'], cwd=work)
          run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], cwd=work)
          run(['git', 'add', '--update', '--', '.github/workflows', 'docs/signing-security.md'], cwd=work)
          run(['git', 'add', '--', 'docs/signing-history-cleanup-2026-09-18.md'], cwd=work)
          run(['git', 'commit', '-m', '安全：完成已泄漏签名历史清理并移除一次性维护工作流'], cwd=work)
          report['new_main'] = git('rev-parse', 'refs/heads/main').decode().strip()
          (root / 'history-cleanup-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Verified filtered history and current source protections. No remote writes yet.')
          PY
      - name: Publish with an exact main-commit lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url='https://github.com/yuangy1995/card_wallet.git'
          test "$(git ls-remote --heads --tags "$url" | wc -l | tr -d ' ')" = 1
          test "$(git ls-remote "$url" refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git --git-dir="$RUNNER_TEMP/rewrite.git" \
            -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push --atomic --force-with-lease="refs/heads/main:$GITHUB_SHA" \
            "$url" refs/heads/main:refs/heads/main
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          report_path = root / 'history-cleanup-report.json'
          report = json.loads(report_path.read_text())
          remote = subprocess.check_output(['git', 'ls-remote', 'https://github.com/yuangy1995/card_wallet.git', 'refs/heads/main'], text=True).split()[0]
          assert remote == report['new_main'], 'Remote main verification failed.'
          report['remote_updated'] = True
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Main history cleanup completed. All original commits preserved; known signing files and plaintext password removed.\n\n')
              output.write('New main: `' + remote + '`. GitHub Support must separately evaluate PR references and caches. Signing Secrets are still required before releases.\n')
          print('Remote main matches the verified cleaned commit.')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: signing-history-cleanup-report
          path: ${{ runner.temp }}/history-cleanup-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove private temporary replacement table
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/history-redactions.private"
