name: Public migration audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/public-migration-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'yuangy1995/card_wallet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect branches and prepare credential-free source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, os, re, subprocess, tarfile
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args])
          report = {'head': git('rev-parse', 'HEAD').decode().strip(), 'branches': [], 'excluded': []}
          branches = git('for-each-ref', '--format=%(refname)', 'refs/remotes/origin').decode().splitlines()
          for ref in branches:
              if ref.endswith('/HEAD') or ref.endswith('/main'):
                  continue
              ahead = int(git('rev-list', '--count', 'HEAD..' + ref))
              report['branches'].append({'ref': ref, 'sha': git('rev-parse', ref).decode().strip(), 'ahead': ahead,
                  'changes': git('diff', '--name-status', 'HEAD', ref).decode()})
          output = Path(os.environ['RUNNER_TEMP']) / 'public-migration-audit'
          output.mkdir()
          sensitive_path = re.compile(r'(?i)(\.(jks|keystore|p12|pfx|p8|pem|key|mobileprovision|provisionprofile)$|(^|/)(\.env($|\.)|keystore\.properties$|signing\.properties$)|\.b64$)')
          sensitive_text = re.compile(rb'-----BEGIN (?:[A-Z ]+ )?PRIVATE KEY-----|(?:ghp_|github_pat_)[A-Za-z0-9_]{20,}|(?:storePassword|keyPassword)\s*=\s*[\"\'][^\"\']+[\"\']')
          with tarfile.open(output / 'source.tar.gz', 'w:gz') as archive:
              refs = [('main', 'HEAD')] + [(item['ref'].rsplit('/', 1)[-1], item['ref']) for item in report['branches'] if item['ahead']]
              for label, ref in refs:
                  for name in git('ls-tree', '-r', '--name-only', ref).decode().splitlines():
                      if sensitive_path.search(name):
                          report['excluded'].append(label + '/' + name)
                          continue
                      if label != 'main' and not name.endswith(('.kt','.kts','.swift','.vue','.js','.yml','.md','.sh','.py','.json','.xml','.plist')):
                          continue
                      data = git('show', ref + ':' + name)
                      if sensitive_text.search(data):
                          report['excluded'].append(label + '/' + name)
                          continue
                      entry = tarfile.TarInfo(label + '/' + name)
                      entry.size = len(data)
                      entry.mode = 0o644
                      archive.addfile(entry, io.BytesIO(data))
          (output / 'audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps({'head': report['head'], 'branches': [{'ref': b['ref'], 'ahead': b['ahead']} for b in report['branches']], 'excluded_files': len(report['excluded'])}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-migration-audit
          path: ${{ runner.temp }}/public-migration-audit/
          retention-days: 1
          if-no-files-found: error
