name: Publish macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本，必须与 apps/macos/project.yml 一致（例如 1.0.0）'
        required: true
        type: string
      publish:
        description: '自动发布到公开仓库；关闭时仅保存签名产物，由维护者下载并上传'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: card-wallet-public-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    if: github.repository == 'yuangy1995/card_wallet' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/macos
    env:
      RELEASE_REPOSITORY: yuangy1995/card_wallet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release configuration
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY" || { echo '::error::请配置当前发布系列的 SPARKLE_PRIVATE_KEY'; exit 1; }
          if [ "$PUBLISH_RELEASE" = true ]; then
            test -n "$GH_TOKEN" || { echo '::error::当前仓库发布需要 GITHUB_TOKEN 的 contents: write 权限'; exit 1; }
            test "$(gh api "repos/$RELEASE_REPOSITORY" --jq .full_name)" = "$RELEASE_REPOSITORY"
          fi
          ruby -ryaml -e '
            settings = YAML.load_file("project.yml").fetch("targets").fetch("CreditCardMac").fetch("settings").fetch("base")
            version = settings.fetch("MARKETING_VERSION").to_s
            build = settings.fetch("CURRENT_PROJECT_VERSION").to_s
            abort "版本输入必须与 project.yml 一致" unless version == ENV.fetch("REQUESTED_VERSION") && version.match?(/\A\d+\.\d+\.\d+\z/)
            abort "构建号必须为正整数" unless build.match?(/\A[1-9]\d*\z/)
            abort "缺少发布说明" unless File.file?("releases/#{version}.md")
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |f| f.puts "version=#{version}", "build=#{build}", "tag=mac-v#{version}-#{build}" }
          '

      - name: Reject existing releases and older builds
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_BUILD: ${{ steps.metadata.outputs.build }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$RELEASE_REPOSITORY/releases?per_page=100" |
            jq -se --arg tag "$RELEASE_TAG" --argjson build "$RELEASE_BUILD" '
              add | all(.[];
                .tag_name != $tag and
                (if (.draft or .prerelease) then true
                 elif (.tag_name | test("^mac-v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$"))
                 then ((.tag_name | split("-") | last | tonumber) < $build)
                 else true end))
            ' || { echo '::error::无法确认发布状态，或标签已存在，或构建号未递增；停止发布。'; exit 1; }

      - name: Verify new update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: swift scripts/check-signing-key.swift Resources/Info.plist

      - name: Pin release tag to the checked-out source
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: python3 ../../scripts/release-tag.py pin "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild -version

      - name: Run release verification tests
        run: |
          set -euo pipefail
          swift scripts/test-verify-update.swift
          xcodebuild test -project CreditCardMac.xcodeproj -scheme CreditCardMac \
            -configuration Release ENABLE_TESTABILITY=YES \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS=''

      - name: Build universal Ad-Hoc application
        run: ./build.sh

      - name: Sign and verify update archives
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_BUILD: ${{ steps.metadata.outputs.build }}
        run: |
          set -euo pipefail
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/卡包.app/Contents/Info.plist)" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/卡包.app/Contents/Info.plist)" = "$RELEASE_BUILD"
          bash prepare-update.sh "$PWD/dist/卡包.app"

      - name: Save signed release assets for maintainer upload
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.tag }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/macos/dist/updates/${{ steps.metadata.outputs.tag }}/CardWallet-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.build }}-arm64.zip
            apps/macos/dist/updates/${{ steps.metadata.outputs.tag }}/CardWallet-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.build }}-x86_64.zip
            apps/macos/dist/updates/${{ steps.metadata.outputs.tag }}/appcast.xml

      - name: Upload release draft and verify remote assets
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_BUILD: ${{ steps.metadata.outputs.build }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          output="dist/updates/$RELEASE_TAG"
          python3 ../../scripts/release-tag.py verify "$RELEASE_TAG" "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --verify-tag --draft \
            --title "卡包 ${RELEASE_VERSION}（Mac）" --notes-file "releases/$RELEASE_VERSION.md" \
            "$output/CardWallet-$RELEASE_VERSION-$RELEASE_BUILD-arm64.zip" \
            "$output/CardWallet-$RELEASE_VERSION-$RELEASE_BUILD-x86_64.zip" \
            "$output/appcast.xml"
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --json isDraft,assets > "$RUNNER_TEMP/macos-release-assets.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "macos-release-assets.json").read_text())
          version, build, tag = (os.environ[k] for k in ("RELEASE_VERSION", "RELEASE_BUILD", "RELEASE_TAG"))
          expected = {f"CardWallet-{version}-{build}-{arch}.zip" for arch in ("arm64", "x86_64")} | {"appcast.xml"}
          assert release["isDraft"], "发布必须仍为草稿"
          assert len(release["assets"]) == 3 and {a["name"] for a in release["assets"]} == expected, "远端附件不完整或包含多余文件"
          for asset in release["assets"]:
              data = (Path("dist/updates") / tag / asset["name"]).read_bytes()
              assert asset["state"] == "uploaded" and asset["size"] == len(data), "远端附件上传未完成"
              assert asset["digest"] == "sha256:" + hashlib.sha256(data).hexdigest(), "远端附件 SHA-256 不一致"
          print("三个远端附件的大小和 SHA-256 全部匹配。")
          PY

      - name: Publish as latest and verify update feed
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          python3 ../../scripts/release-tag.py verify "$RELEASE_TAG" "$GITHUB_SHA"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest
          test "$(gh api "repos/$RELEASE_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/$RELEASE_REPOSITORY/releases/latest/download/appcast.xml" \
            -o "$RUNNER_TEMP/macos-published-appcast.xml"
          cmp "dist/updates/$RELEASE_TAG/appcast.xml" "$RUNNER_TEMP/macos-published-appcast.xml"
          echo "发布成功：https://github.com/$RELEASE_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
