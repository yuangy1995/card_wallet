name: Platform quality
on:
  pull_request:
    paths: ['apps/**', 'contracts/**', 'scripts/**', '.github/workflows/platform-quality.yml']
  push:
    branches: [main]
    paths: ['apps/**', 'contracts/**', 'scripts/**', '.github/workflows/platform-quality.yml']
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle.kts
      - name: Native build and regression suite
        working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-android-${{ github.run_id }}
          retention-days: 7
          path: |
            apps/android/app/build/test-results/
            apps/android/app/build/reports/tests/
  apple:
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Generate native project
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd apps/${{ matrix.platform }}
          xcodegen generate
          mkdir -p build
          git rev-parse HEAD > build/source-commit.txt
      - name: Native tests
        working-directory: apps/${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          if [ "$PLATFORM" = macos ]; then
            xcodebuild test -project CreditCardMac.xcodeproj -scheme CreditCardMac -destination 'platform=macOS' -derivedDataPath build/DerivedData -resultBundlePath build/Parity.xcresult CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_APP_SANDBOX=NO WALLET_CODE_SIGN_ENTITLEMENTS=Resources/CreditCardMacAdHoc.entitlements 2>&1 | tee build/tests.log
          else
            DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
            xcodebuild test -project CreditCardIOS.xcodeproj -scheme CreditCardIOS -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/Parity.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
          fi
      - name: Summarize tests
        if: always()
        working-directory: apps/${{ matrix.platform }}
        run: |
          if test -d build/Parity.xcresult; then
            xcrun xcresulttool get test-results summary --path build/Parity.xcresult > build/test-summary.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ matrix.platform }}-${{ github.run_id }}
          retention-days: 7
          path: |
            apps/${{ matrix.platform }}/build/tests.log
            apps/${{ matrix.platform }}/build/source-commit.txt
            apps/${{ matrix.platform }}/build/test-summary.json
            apps/${{ matrix.platform }}/build/brand-review/
            apps/${{ matrix.platform }}/*.xcodeproj/project.pbxproj
