name: Apply public release migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/public-release-apply.yml]
permissions:
  contents: read
concurrency:
  group: public-release-source-migration
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'yuangy1995/card_wallet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source edits against their exact baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          base = '1852b798ee2963171f89f852bac836b946652827'
          manifests = [Path(f'.public-migration/edits-{i}.json') for i in range(1, 5)]
          operations = [op for manifest in manifests for op in json.loads(manifest.read_text())]
          names = [op['path'] for op in operations]
          assert len(names) == len(set(names)) == 30
          prepared = {}
          for op in operations:
              name = op['path']
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] not in ('.git', '.github', '.public-migration')
              assert not path.is_symlink()
              previous = subprocess.run(['git', 'show', base + ':' + name], capture_output=True)
              if previous.returncode == 0:
                  assert path.is_file() and path.read_bytes() == previous.stdout, 'Source changed since review: ' + name
                  lines = previous.stdout.decode().splitlines(keepends=True)
              else:
                  assert not path.exists(), 'New path already exists: ' + name
                  lines = []
              limit = len(lines)
              for first, last, text in reversed(op['edits']):
                  assert 0 <= first <= last <= limit
                  lines[first:last] = [text]
                  limit = first
              prepared[name] = ''.join(lines).encode()
          digest = hashlib.sha256()
          for name in sorted(prepared):
              digest.update(name.encode() + b'\0' + prepared[name] + b'\0')
          assert digest.hexdigest() == 'c6b096f111ad720dee7b4c9050aac8d6b317af5fc826c3ce77933fda243442f4', 'Reviewed content digest differs'
          for name, data in prepared.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          for manifest in manifests:
              manifest.unlink()
          Path('.public-migration').rmdir()
          subprocess.run(['git', 'add', '--', *names, '.public-migration'], check=True)
          print('30 source files match the reviewed migration digest; temporary manifests removed.')
          PY
          git diff --cached --check
          python3 scripts/check-signing-secrets.py
          python3 -m unittest discover -s scripts -p 'test_*security.py'
          python3 -m unittest discover -s scripts -p 'test_public_release_migration.py'
          python3 -m unittest discover -s apps/android/scripts -p 'test_*.py'
      - name: Commit verified source changes without rewriting history
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '安全与发布：迁移当前公开仓库更新通道及新签名信任基准'
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "迁移提交：$(git rev-parse HEAD)；23 项配置与签名回归检查通过。" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete only unchanged branches already contained in main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'codex/four-platform-parity-20260918': '1838e0475501f2acf8b186b60b9177f09201f5e7',
              'codex/web-audit-platform-parity-20260918': 'ca0eb54dc5fd6ea976ee39d8b8549a040eadda9e',
              'codex/web-security-performance-completion': '430f9336240a98d1e95c69fc04a483b151fd1169',
              'codex/public-release-migration-20260918': '890b7fc36fbc68f16831ca154ce3eb036f1aed3f',
          }
          selected = {}
          for branch, sha in expected.items():
              ref = 'refs/heads/' + branch
              remote = subprocess.check_output(['git', 'ls-remote', 'origin', ref], text=True).split()
              if not remote:
                  print('Already absent: ' + branch)
                  continue
              if remote[0] != sha:
                  print('Preserved moved branch: ' + branch)
                  continue
              if subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD']).returncode:
                  print('Preserved unmerged branch: ' + branch)
                  continue
              selected[ref] = sha
          if selected:
              command = ['git', 'push', '--atomic']
              command += ['--force-with-lease=' + ref + ':' + sha for ref, sha in selected.items()]
              command += ['origin'] + [':' + ref for ref in selected]
              subprocess.run(command, check=True)
          print('Deleted verified merged branches: ' + str(len(selected)))
          print('Divergent completion/stages branches intentionally preserved; history was not rewritten.')
          PY
  quality:
    needs: apply
    permissions:
      contents: read
    uses: ./.github/workflows/platform-quality.yml
    with:
      checkout_ref: ${{ needs.apply.outputs.commit }}
