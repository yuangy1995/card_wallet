name: Apply verified parity changes
on:
  push:
    branches: [codex/four-platform-parity-20260918]
    paths: [.github/workflows/parity-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: patch
        name: Integrate reviewed source and register native project files
        run: |
          python3 .parity-finish.py
          python3 scripts/sync-wallet-brand-assets.py --check
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          (cd apps/ios && xcodegen generate)
          (cd apps/macos && xcodegen generate)
          git config user.name 'lovelife'
          git config user.email '32153802+yuangy1995@users.noreply.github.com'
          git add apps contracts scripts
          git rm .parity-finish.py
          git commit -m '第四阶段：统一离线品牌素材、卡组织规则与主题，修复原生数据库初始化'
          git push origin HEAD:codex/four-platform-parity-20260918
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  quality:
    needs: apply
    uses: ./.github/workflows/platform-quality.yml
    with:
      checkout_ref: ${{ needs.apply.outputs.sha }}
    permissions:
      contents: read
