name: Apply verified parity changes
on:
  push:
    branches: [codex/four-platform-parity-20260918]
    paths: [.github/workflows/parity-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/four-platform-parity-20260918
      - id: patch
        name: Verify and apply source delta
        run: |
          python3 - <<'PY'
          import pathlib, base64, lzma, hashlib, json
          parts = [pathlib.Path(f'.parity-transfer/s3-{i:02}.b64') for i in range(1,21)]
          for p in parts: print(p.name, len(p.read_text().strip()), hashlib.sha256(p.read_bytes()).hexdigest())
          data = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(data).hexdigest() == '2c138bbee3afc8f3b979c6818dce546d354bef448fa78dd76c24ce7ef27e09af', 'Source checksum mismatch'
          writes = []
          for name, before, after, operations in json.loads(data):
            path = pathlib.Path(name)
            assert name.startswith(('apps/', 'contracts/')) and '..' not in path.parts
            old = path.read_bytes() if path.exists() else b''
            assert hashlib.sha256(old).hexdigest() == before, name + ' base changed'
            lines = old.decode().splitlines(keepends=True)
            for start, end, text in reversed(operations): lines[start:end] = [text]
            new = ''.join(lines).encode()
            assert hashlib.sha256(new).hexdigest() == after, name + ' result mismatch'
            writes.append((path, new))
          for path, data in writes:
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(data)
          PY
          git config user.name 'lovelife'
          git config user.email '32153802+yuangy1995@users.noreply.github.com'
          git add apps contracts
          git rm -r .parity-transfer
          git commit -m '第三阶段：补齐本机收藏图片规则并保护原生本地数据与锁定生命周期'
          git push origin HEAD:codex/four-platform-parity-20260918
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  quality:
    needs: apply
    uses: ./.github/workflows/platform-quality.yml
    with:
      checkout_ref: ${{ needs.apply.outputs.sha }}
    permissions:
      contents: read
