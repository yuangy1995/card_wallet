name: CreditCardIOS
options:
  bundleIdPrefix: com.applist
  createIntermediateGroups: true
schemes:
  CreditCardIOS:
    build:
      targets:
        CreditCardIOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
packages:
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: 1.8.0
targets:
  CreditCardIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Domain
      - path: Features
      - path: Resources
    dependencies:
      - package: CryptoSwift
        product: CryptoSwift
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSCameraUsageDescription: "扫描银行卡"
        INFOPLIST_KEY_NFCReaderUsageDescription: "读取银行卡 NFC 信息"
