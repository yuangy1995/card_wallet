name: CreditCardMac
options:
  bundleIdPrefix: com.applist
packages:
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: 1.8.0
targets:
  CreditCardMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Domain
      - path: Features
      - path: Resources
    dependencies:
      - package: CryptoSwift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/CreditCardMac.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
  CreditCardMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: CreditCardMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
