name: CreditCardIOS
options:
  bundleIdPrefix: com.applist
  createIntermediateGroups: true
schemes:
  CreditCardIOS:
    build:
      targets:
        CreditCardIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [CreditCardIOSTests]
      environmentVariables:
        WALLET_TEST_HOST: "1"
    archive:
      config: Release
targets:
  CreditCardIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Domain
        excludes:
          - NFCCardReader.swift
      - path: Features
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.applist.cardwallet.ios
        CODE_SIGN_ENTITLEMENTS: CreditCardIOS.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - AppIcon-Minimal
          - AppIcon-Cool
          - AppIcon-Retro
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSCameraUsageDescription: "扫描银行卡"
  CreditCardIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: ../../contracts/card-wallet/fixtures
        buildPhase: resources
    dependencies:
      - target: CreditCardIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
