name: CreditCardMac
options:
  bundleIdPrefix: com.applist
  developmentLanguage: zh-Hans
schemes:
  CreditCardMac:
    build:
      targets:
        CreditCardMac: all
    test:
      targets:
        - CreditCardMacTests
      environmentVariables:
        WALLET_TEST_HOST: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.6
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: 1.8.0
targets:
  CreditCardMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Domain
      - path: Features
      - path: Resources
    dependencies:
      - package: CryptoSwift
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.applist.cardwallet.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WALLET_CODE_SIGN_ENTITLEMENTS: Resources/CreditCardMac.entitlements
        CODE_SIGN_ENTITLEMENTS: $(WALLET_CODE_SIGN_ENTITLEMENTS)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  CreditCardMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: CreditCardMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
